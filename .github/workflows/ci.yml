name: Checks

on:
  push:
    branches: ['master']
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { elixir: '1.18', otp: '27', rust: '1.91.0' }
          - { elixir: '1.20', otp: '29', rust: stable }
    env:
      CC: clang
      CXX: clang++
      EX_FASTEMBED_BUILD: '1'
      ORT_CACHE_DIR: ${{ github.workspace }}/.ort-cache
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: erlef/setup-beam@v1.24.1
        id: beam
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libssl-dev pkg-config
      - name: Cache Rust dependencies and ONNX Runtime
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: native/ex_fastembed
          cache-directories: .ort-cache
      - name: Cache Mix dependencies and Dialyzer PLTs
        uses: actions/cache@v6.1.0
        with:
          path: |
            deps
            _build/*/lib/*
            !_build/*/lib/ex_fastembed
            !_build/*/lib/ex_fastembed/**
            _build/*/*.plt*
            ~/.mix/*.plt*
          key: mix-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock', 'mix.exs') }}
          restore-keys: |
            mix-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-
      - run: mix deps.get --check-locked
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - name: Check model documentation and lockfiles
        run: |
          mix run scripts/update_models.exs
          git diff --exit-code -- guides/models.md mix.lock native/ex_fastembed/Cargo.lock
      - run: mix test --cover
      - run: mix credo --strict
      - run: mix dialyzer
      - run: mix docs --warnings-as-errors
      - run: cargo fmt --check
        working-directory: native/ex_fastembed
      - run: cargo test --locked
        working-directory: native/ex_fastembed
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
        working-directory: native/ex_fastembed
      - name: Check Hex package
        if: matrix.rust == 'stable'
        run: mix hex.build
      - name: Check published NIF checksums
        if: matrix.rust == 'stable' && hashFiles('checksum-Elixir.ExFastembed.Native.exs') != ''
        run: elixir scripts/checksums.exs --check
