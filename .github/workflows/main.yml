name: Build precompiled NIFs

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches: ['**']
    paths:
      - 'native/**'
      - 'lib/**'
      - 'mix.exs'
      - 'scripts/checksums.exs'
      - 'scripts/nif_smoke.exs'
      - '.github/workflows/main.yml'

permissions:
  contents: write

jobs:
  build_release:
    name: NIF ${{ matrix.nif }} - ${{ matrix.job.target }} (${{ matrix.job.os }})
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        nif: ["2.16", "2.15"]
        job:
          # Targets with downloadable binaries in ort-sys 2.0.0-rc.13.
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04 }
          - { target: x86_64-pc-windows-msvc, os: windows-2022 }

    env:
      CC: ${{ matrix.job.os == 'windows-2022' && 'cl' || 'clang' }}
      CXX: ${{ matrix.job.os == 'windows-2022' && 'cl' || 'clang++' }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7.0.1

      - name: System deps (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            libssl-dev \
            pkg-config

      - name: Extract project version
        shell: bash
        run: |
          project_version=$(awk -F'"' '/^  @version / {print $2; exit}' mix.exs)
          test -n "$project_version"
          cargo_version=$(awk -F'"' '/^version = / {print $2; exit}' native/ex_fastembed/Cargo.toml)
          test "$project_version" = "$cargo_version"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "$GITHUB_REF_NAME" = "v$project_version"
          fi
          echo "PROJECT_VERSION=$project_version" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.job.target }}

      - name: Initialize the Windows C++ build environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Resolve the MSVC compiler and linker
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = (Get-Command cl.exe -ErrorAction Stop).Source
          $linker = (Get-Command link.exe -ErrorAction Stop).Source
          "CC=$compiler" >> $env:GITHUB_ENV
          "CXX=$compiler" >> $env:GITHUB_ENV
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" >> $env:GITHUB_ENV

      - name: Build and archive the native NIF
        id: build-crate
        working-directory: native/ex_fastembed
        shell: bash
        env:
          NIF_TARGET: ${{ matrix.job.target }}
          NIF_VERSION: ${{ matrix.nif }}
        run: |
          cargo build --release --locked --target "$NIF_TARGET" \
            --no-default-features --features "nif_version_${NIF_VERSION//./_}"
          case "$NIF_TARGET" in
            *windows*) source_library=ex_fastembed.dll; prefix=; extension=dll ;;
            *apple-darwin) source_library=libex_fastembed.dylib; prefix=lib; extension=so ;;
            *) source_library=libex_fastembed.so; prefix=lib; extension=so ;;
          esac
          library="${prefix}ex_fastembed-v$PROJECT_VERSION-nif-$NIF_VERSION-$NIF_TARGET.$extension"
          cp "target/$NIF_TARGET/release/$source_library" "$RUNNER_TEMP/$library"
          tar -czf "../../$library.tar.gz" -C "$RUNNER_TEMP" "$library"
          {
            echo "file-name=$library.tar.gz"
            echo "file-path=$library.tar.gz"
            echo "library-path=$RUNNER_TEMP/$library"
          } >> "$GITHUB_OUTPUT"

      - name: Install BEAM for the Windows runtime check
        if: runner.os == 'Windows'
        uses: erlef/setup-beam@v1.24.1
        with:
          elixir-version: '1.18'
          otp-version: '27'

      - name: Verify Windows NIF loading and embedding inference
        if: runner.os == 'Windows'
        shell: bash
        env:
          NIF_PATH: ${{ steps.build-crate.outputs.library-path }}
          FASTEMBED_CACHE_DIR: ${{ runner.temp }}/fastembed-models
        run: elixir scripts/nif_smoke.exs "$NIF_PATH"

      - name: Artifact upload
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.build-crate.outputs.file-name }}
          path: ${{ steps.build-crate.outputs.file-path }}
          if-no-files-found: error

  checksums:
    name: Collect NIF archives and generate checksums
    runs-on: ubuntu-24.04
    needs: build_release
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: erlef/setup-beam@v1.24.1
        with:
          elixir-version: '1.18'
          otp-version: '27'
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: '*ex_fastembed-*.tar.gz'
          path: release-artifacts
          merge-multiple: true
      - name: Generate and validate the complete checksum map
        run: |
          elixir scripts/checksums.exs release-artifacts
          elixir scripts/checksums.exs --check
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: nif-release
          path: |
            release-artifacts/*.tar.gz
            checksum-Elixir.ExFastembed.Native.exs
          if-no-files-found: error
      - name: Attach archives and checksum to the published release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          fail_on_unmatched_files: true
          files: |
            release-artifacts/*.tar.gz
            checksum-Elixir.ExFastembed.Native.exs
