name: Build precompiled NIFs

on:
  workflow_dispatch:
  push:
    branches: ['prepare-hex-release']
    paths:
      - 'native/**'
      - 'lib/**'
      - 'mix.exs'
      - 'scripts/checksums.exs'
      - '.github/workflows/main.yml'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build_release:
    name: NIF ${{ matrix.nif }} - ${{ matrix.job.target }} (${{ matrix.job.os }})
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        nif: ["2.16", "2.15"]
        job:
          # Targets with downloadable binaries in ort-sys 2.0.0-rc.13.
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04 }

    env:
      CC: clang
      CXX: clang++

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7.0.1

      - name: System deps (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            libssl-dev \
            pkg-config

      - name: Extract project version
        shell: bash
        run: |
          project_version=$(awk -F'"' '/^  @version / {print $2; exit}' mix.exs)
          test -n "$project_version"
          cargo_version=$(awk -F'"' '/^version = / {print $2; exit}' native/ex_fastembed/Cargo.toml)
          test "$project_version" = "$cargo_version"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "$GITHUB_REF_NAME" = "v$project_version"
          fi
          echo "PROJECT_VERSION=$project_version" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.job.target }}

      - name: Build the project
        id: build-crate
        uses: philss/rustler-precompiled-action@v1.1.5
        with:
          project-name: ex_fastembed
          project-version: ${{ env.PROJECT_VERSION }}
          target: ${{ matrix.job.target }}
          nif-version: ${{ matrix.nif }}
          use-cross: false
          project-dir: "native/ex_fastembed"
          cargo-args: "--locked"

      - name: Artifact upload
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.build-crate.outputs.file-name }}
          path: ${{ steps.build-crate.outputs.file-path }}
          if-no-files-found: error

  checksums:
    name: Collect NIF archives and generate checksums
    runs-on: ubuntu-24.04
    needs: build_release
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: erlef/setup-beam@v1.24.1
        with:
          elixir-version: '1.18'
          otp-version: '27'
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: 'libex_fastembed-*.tar.gz'
          path: release-artifacts
          merge-multiple: true
      - name: Generate and validate the complete checksum map
        run: |
          elixir scripts/checksums.exs release-artifacts
          elixir scripts/checksums.exs --check
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: nif-release
          path: |
            release-artifacts/*.tar.gz
            checksum-Elixir.ExFastembed.Native.exs
          if-no-files-found: error
      - name: Publish archives and checksum on version tags
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3.0.3
        with:
          fail_on_unmatched_files: true
          files: |
            release-artifacts/*.tar.gz
            checksum-Elixir.ExFastembed.Native.exs
