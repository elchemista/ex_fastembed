name: Build precompiled NIFs

on:
  push:
    tags:
      - 'v*'
  # optionally also:
  # pull_request:

permissions:
  contents: write
  # ↑ Important so we can upload releases with softprops/action-gh-release

jobs:
  build_release:
    name: "Build Rust NIF"
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        # List all supported NIF versions
        nif: ["2.16", "2.15"]
        # Our build matrix (target + OS + "use-cross" bool)
        job:
          - { target: arm-unknown-linux-gnueabihf, os: ubuntu-20.04, use-cross: true }
          - { target: aarch64-unknown-linux-gnu,   os: ubuntu-20.04, use-cross: true }
          - { target: aarch64-unknown-linux-musl,  os: ubuntu-20.04, use-cross: true }
          - { target: aarch64-apple-darwin,        os: macos-14,     use-cross: false }
          - { target: x86_64-apple-darwin,         os: macos-14,     use-cross: false }
          - { target: x86_64-unknown-linux-gnu,    os: ubuntu-20.04, use-cross: false }
          - { target: x86_64-unknown-linux-musl,   os: ubuntu-20.04, use-cross: true }

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Install system dependencies (Ubuntu)
        if: matrix.job.os == 'ubuntu-20.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libssl-dev \
            gcc-arm-linux-gnueabihf \
            musl-dev \
            musl-tools

      - name: Install system dependencies (macOS)
        if: matrix.job.os == 'macos-14'
        run: |
          brew update
          brew install pkg-config openssl@1.1
          echo "/usr/local/opt/openssl@1.1/lib/pkgconfig" >> $GITHUB_PATH

      - name: Extract project version
        shell: bash
        run: |
          echo "PROJECT_VERSION=$(sed -n 's/^  @version \"\\(.*\\)\"/\\1/p' mix.exs | head -n1)" >> $GITHUB_ENV

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: ${{ matrix.job.target }}

      - name: Build the project
        id: build-crate
        uses: philss/rustler-precompiled-action@v1.0.1
        with:
          project-name: ex_fastembed
          project-version: ${{ env.PROJECT_VERSION }}
          target: ${{ matrix.job.target }}
          nif-version: ${{ matrix.nif }}
          use-cross: ${{ matrix.job.use-cross }}
          project-dir: "native/ex_fastembed"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build-crate.outputs.file-name }}
          path: ${{ steps.build-crate.outputs.file-path }}

      - name: Publish archives and packages
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.build-crate.outputs.file-path }}
