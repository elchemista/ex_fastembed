version: '3'

vars:
  PROJECT_NAME: ExFastembed
  PROJECT_DIR_NAME: ex_fastembed

env:
  EX_FASTEMBED_BUILD: '1'

tasks:
  compile:
    desc: Compile sources (with Rust)
    env:
      CC: clang
      CXX: clang++
    cmds:
      - mix compile

  console:
    desc: Open console
    cmds:
      - cmd: iex -S mix
        ignore_error: true

  test:
    desc: Run ExUnit, doctests, and Elixir coverage
    cmds:
      - mix test --cover

  integration-test:
    desc: Run model inference tests (downloads models on first use)
    cmds:
      - mix test --include integration --cover

  models:
    desc: Regenerate the supported model guide
    cmd: mix run scripts/update_models.exs

  check:
    desc: Run all merge checks
    cmds:
      - mix format --check-formatted
      - mix compile --warnings-as-errors
      - task: test
      - mix credo --strict
      - task: dialyzer
      - task: rust-format
      - task: rust-test
      - task: clippy
      - task: docs

  docs:
    desc: Build HexDocs with warnings denied
    cmd: mix docs --warnings-as-errors

  coverage:
    desc: Measure Elixir and Rust coverage with real inference
    cmd: bash scripts/coverage.sh

  source-package-smoke:
    desc: Test the Hex source archive in an isolated production consumer
    cmd: bash scripts/package_smoke.sh --source

  package-smoke:
    desc: Build and test the Hex archive in an isolated consumer
    cmd: bash scripts/package_smoke.sh

  source-check:
    desc: Verify source, coverage, and package before building release NIFs
    cmds:
      - task: check
      - task: coverage
      - task: source-package-smoke

  release-check:
    desc: Run all checks and build the Hex package and documentation
    cmds:
      - task: check
      - task: coverage
      - task: package-smoke
      - mix hex.build

  dialyzer:
    desc: Run dialyzer
    cmd: mix dialyzer

  clippy:
    desc: Run Clippy with warnings denied
    dir: "native/{{.PROJECT_DIR_NAME}}"
    cmd: cargo clippy --locked --all-targets --all-features -- -D warnings

  rust-format:
    desc: Check Rust formatting
    dir: "native/{{.PROJECT_DIR_NAME}}"
    cmd: cargo fmt --check

  rust-test:
    desc: Run Rust unit tests
    dir: "native/{{.PROJECT_DIR_NAME}}"
    cmd: cargo test --locked

  clean:
    desc: Clean up
    cmds:
      - mix clean
      - rm -f priv/native/*.so
      - "rm -rf native/{{.PROJECT_DIR_NAME}}/target/*/build"

  publish:
    desc: Publish to hex.pm
    prompt: Are you sure to publish?
    cmds:
      - elixir scripts/checksums.exs --check
      - mix hex.publish

  default:
    cmds:
      - task -l --sort=none
    silent: true
