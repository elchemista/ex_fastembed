version: '3'

vars:
  PROJECT_NAME: ExFastembed
  PROJECT_DIR_NAME: ex_fastembed

tasks:
  compile:
    desc: Compile sources (with Rust)
    env:
      CC: clang
      CXX: clang++
    cmds:
      - mix compile

  console:
    desc: Open console
    cmds:
      - cmd: iex -S mix
        ignore_error: true

  test:
    desc: Run tests (with Rust)
    cmds:
      - mix test --trace

  integration-test:
    desc: Run model inference tests (downloads models on first use)
    cmds:
      - mix test --only integration --trace

  models:
    desc: Regenerate the supported model lists in README
    cmd: mix run scripts/update_models.exs

  check:
    desc: Run all merge checks
    cmds:
      - mix format --check-formatted
      - mix compile --warnings-as-errors
      - task: test
      - mix credo --strict
      - task: dialyzer
      - task: rust-format
      - task: rust-test
      - task: clippy

  dialyzer:
    desc: Run dialyzer
    cmd: mix dialyzer

  clippy:
    desc: Run Clippy with warnings denied
    dir: "native/{{.PROJECT_DIR_NAME}}"
    cmd: cargo clippy --locked --all-targets --all-features -- -D warnings

  rust-format:
    desc: Check Rust formatting
    dir: "native/{{.PROJECT_DIR_NAME}}"
    cmd: cargo fmt --check

  rust-test:
    desc: Run Rust unit tests
    dir: "native/{{.PROJECT_DIR_NAME}}"
    cmd: cargo test --locked

  clean:
    desc: Clean up
    cmds:
      - mix clean
      - rm -f priv/native/*.so
      - "rm -rf native/{{.PROJECT_DIR_NAME}}/target/*/build"

  publish:
    desc: Publish to hex.pm
    prompt: Are you sure to publish?
    cmds:
      - mix hex.publish

  default:
    cmds:
      - task -l --sort=none
    silent: true
