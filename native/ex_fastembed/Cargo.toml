[package]
name = "ex_fastembed"
version = "0.1.0"
authors = ["Yuriy Zhar"]
license = "Apache-2.0"
repository = "https://github.com/elchemista/ex_fastembed"
publish = false
edition = "2021"
rust-version = "1.91"

[lib]
name = "ex_fastembed"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
fastembed = { version = "6.1.0", default-features = false, features = ["hf-hub-native-tls", "ort-download-binaries-native-tls"] }
hf-hub = { version = "0.5.0", default-features = false }
rustler = { version = "0.38.0", default-features = false }

[dev-dependencies]
tempfile = "3"

[features]
default = ["nif_version_2_15"]
nif_version_2_15 = ["rustler/nif_version_2_15"]
nif_version_2_16 = ["rustler/nif_version_2_16"]

[profile.release]
codegen-units = 1
lto = true
strip = "debuginfo"
